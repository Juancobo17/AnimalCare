# Integración continua: en cada push y pull request se ejecutan las pruebas
# del backend (API), las unitarias del frontend y las de extremo a extremo.
# Si algo falla, el pull request queda marcado en rojo.
name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:

env:
  DATABASE_URL: mysql://root:ci_password@127.0.0.1:3306/animalcare_ci
  JWT_SECRET: clave_solo_para_ci
  CLINIC_TIMEZONE: America/Bogota
  REMINDERS_ENABLED: "false"
  MAIL_TRANSPORT: console
  FRONTEND_URL: http://localhost:5173

jobs:
  backend:
    name: Backend (API)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: animalcare_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Pruebas unitarias (zona horaria)
        run: node --test tests/schedule.test.js
      - name: Levantar la API
        run: |
          PORT=4000 MAIL_OUTBOX_FILE=$RUNNER_TEMP/outbox.jsonl node server.js > $RUNNER_TEMP/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
      - name: Pruebas de la API
        run: MAIL_OUTBOX_FILE=$RUNNER_TEMP/outbox.jsonl npm test
      - name: Registro de la API si algo falla
        if: failure()
        run: cat $RUNNER_TEMP/api.log

  frontend:
    name: Frontend (lint, unitarias, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: animalcare_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          PORT=4000 node server.js > $RUNNER_TEMP/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          VITE_API_URL=http://localhost:4000/api npm run build
          npx vite preview --port 5173 > $RUNNER_TEMP/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/login > /dev/null && break; sleep 1; done
      - name: Pruebas e2e
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
