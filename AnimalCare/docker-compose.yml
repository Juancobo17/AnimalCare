# Entorno completo: base de datos, API y frontend (nginx).
#   docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:8080/api
#
# Cambia las contrasenas y JWT_SECRET antes de usarlo fuera de tu maquina.
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: animalcare
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: "mysql://root:rootpassword@db:3306/animalcare"
      PORT: 4000
      JWT_SECRET: "cambia_esta_clave_antes_de_publicar"
      JWT_EXPIRES_IN: "2h"
      CLINIC_TIMEZONE: "America/Bogota"
      # El frontend se sirve en 8080 y nginx reenvia /api al backend.
      CORS_ORIGIN: "http://localhost:8080"
      FRONTEND_URL: "http://localhost:8080"
      TRUST_PROXY: "true"
      # Correo: "console" imprime los correos en el log; "smtp" los envia (SMTP_URL, MAIL_FROM).
      MAIL_TRANSPORT: "console"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  uploads:
